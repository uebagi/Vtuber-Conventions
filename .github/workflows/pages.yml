name: Publish schedule to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets _site/
          for schedule in */schedule.csv; do
            directory="$(dirname "$schedule")"
            mkdir -p "_site/$directory"
            cp "$directory/index.html" "$schedule" "_site/$directory/"
            for data in socials.json opening-hours.json; do
              if [ -f "$directory/$data" ]; then
                cp "$directory/$data" "_site/$directory/"
              fi
            done
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
