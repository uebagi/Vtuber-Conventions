<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse Kumoricon 2026 VTuber panels, concerts, meet-and-greets and fan activities. All times are Pacific Standard Time.">
  <title>Kumoricon 2026 · Schedule</title>
  <link rel="stylesheet" href="../../assets/styles.css">
  <script src="../../assets/timetable.js" defer></script>
  <script src="../../assets/app.js" defer></script>
</head>
<body data-groups="groups.json" data-opening-hours="opening-hours.json" data-socials="socials.json" data-event-name="Kumoricon" data-event-id="kumoricon-2026" data-venue="Oregon Convention Center, Portland, Oregon, USA">
  <main>
    <header class="hero">
      <a href="../../">Conventions</a>
      <p class="intro">Kumoricon 2026 · November 13–15, 2026 · Oregon Convention Center, Portland</p>
      <div class="hero-links"><span class="timezone">All times PST · UTC−8</span><a href="https://www.kumoricon.org/schedule" target="_blank" rel="noopener noreferrer">Official schedule ↗</a><a href="schedule.csv" download>Download CSV ↓</a></div>
    </header>

    <section id="opening-hours" class="opening-hours" aria-labelledby="opening-hours-heading" hidden></section>

    <section class="controls" aria-label="Filter schedule">
      <div class="days" role="group" aria-label="Day"></div>
      <div class="filters">
        <label class="search">Performer or session<input id="search" type="search" autocomplete="off"></label>
        <label>Stage, room or booth<select id="stage"><option value="all">All locations</option></select></label>
        <label class="checkbox"><input id="announced" type="checkbox"> Announced sessions only</label>
        <div class="filter-pair">
          <div class="type-filter"><span id="event-types-label">Event types</span><details id="event-types" class="type-menu"><summary id="event-types-summary" aria-describedby="event-types-label">All events</summary><fieldset><legend class="visually-hidden">Event types</legend><label><input type="checkbox" value="all" checked> All events</label><label><input type="checkbox" value="stage-panel"> Stages & panels</label><label><input type="checkbox" value="concert"> Concerts</label><label><input type="checkbox" value="meet-greet"> Meet & greets</label><label><input type="checkbox" value="roaming"> Roaming</label><label><input type="checkbox" value="afterparty"> Afterparties</label></fieldset></details></div>
          <label>Event status<select id="event-status"><option value="all">Official & unofficial</option><option value="official">Official</option><option value="unofficial">Unofficial</option></select></label>
        </div>
        <label class="talent-filter">Talent<select id="talent"><option value="all">All talents</option></select></label>
        <label class="group-filter">Group / agency<select id="group"><option value="all">All groups</option></select></label>
      </div>
    </section>

    <div class="results-bar"><p id="status" role="status" aria-live="polite">Loading the schedule…</p><div class="result-actions"><label class="view-switch">View<select id="schedule-view" aria-label="Schedule view"><option value="calendar">Calendar</option><option value="cards">Cards</option></select></label><button id="download-calendar" type="button" disabled>Download calendar (.ics)</button><button id="reset" type="button" class="reset">Reset filters</button></div></div>
    <div id="schedule" aria-label="Sessions"></div>
    <noscript><p>Enable JavaScript to browse the schedule, or <a href="schedule.csv">download the CSV</a>.</p></noscript>
    <footer>Unofficial planner · Schedule and guest information checked November 12, 2026</footer>
  </main>
</body>
</html>
