<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse VeXpo 2026 stages, panels, meet-and-greets and announced performers. All times are British Summer Time.">
  <title>VeXpo 2026 · Schedule</title>
  <link rel="stylesheet" href="../../assets/styles.css">
  <script src="../../assets/app.js" defer></script>
</head>
<body data-opening-hours="opening-hours.json" data-socials="socials.json" data-event-name="VeXpo" data-event-id="vexpo-2026" data-venue="NEC, Birmingham, UK" data-uid-domain="vexpo-fan-planner">
  <main>
    <header class="hero">
      <a href="../../">Conventions</a>
      <p class="intro">VeXpo 2026 · September 18–20, 2026 · NEC, Birmingham</p>
      <div class="hero-links"><span class="timezone">All times BST · UTC+1</span><a href="https://vexpo.uk/stages-panels" target="_blank" rel="noopener noreferrer">Official schedule ↗</a><a href="schedule.csv" download>Download CSV ↓</a></div>
    </header>

    <section id="opening-hours" class="opening-hours" aria-labelledby="opening-hours-heading" hidden></section>

    <section class="controls" aria-label="Filter schedule">
      <div class="days" role="group" aria-label="Day"></div>
      <div class="filters">
        <label class="search">Performer or session<input id="search" type="search" autocomplete="off"></label>
        <label>Stage, room or booth<select id="stage"><option value="all">All locations</option></select></label>
        <label class="checkbox"><input id="announced" type="checkbox"> Announced sessions only</label>
        <label class="checkbox"><input id="concerts" type="checkbox"> Concerts only</label>
        <div class="filter-pair">
          <label>Meet & greets<select id="meet-greets"><option value="all">All sessions</option><option value="only">Meet & greets only</option><option value="exclude">Exclude meet & greets</option></select></label>
          <label>Event status<select id="event-status"><option value="all">Official & unofficial</option><option value="official">Official</option><option value="unofficial">Unofficial</option></select></label>
        </div>
      </div>
    </section>

    <div class="results-bar"><p id="status" role="status" aria-live="polite">Loading the schedule…</p><div class="result-actions"><button id="download-calendar" type="button" disabled>Download calendar (.ics)</button><button id="reset" type="button" class="reset">Reset filters</button></div></div>
    <div id="schedule" aria-label="Sessions"></div>
    <noscript><p>Enable JavaScript to browse the schedule, or <a href="schedule.csv">download the CSV</a>.</p></noscript>
    <footer>Unofficial planner · Stages checked September 4, 2026 · Meet & greets checked September 5, 2026</footer>
  </main>
</body>
</html>
